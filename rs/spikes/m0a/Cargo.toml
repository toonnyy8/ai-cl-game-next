# M0a speed test (throwaway spike, docs/bevy/plans/2026-11-26-m0a-speed-test.md): replays frames captured from the frozen game.
[package]
name = "m0a"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bevy = { workspace = true, features = [
  "default_app", "std", "bevy_winit", "x11", "default_font", "common_api",
  "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light", "ui_api", "ui_bevy_render", "webgpu",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console", "Window", "Performance", "Location"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
