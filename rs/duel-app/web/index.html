<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SOUL DUEL</title>
<link rel="icon" href="data:,">
<style>
:root { --bg: #141419; --fg: #eeeeee; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141419; --fg: #eeeeee; } }
  :root[data-theme="dark"] { --bg: #141419; --fg: #eeeeee; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  #bevy { display: block; width: 100vw !important; height: 100vh !important; touch-action: none; }
  #fatal { display: none; position: fixed; inset: 0; padding: 24px; color: var(--fg); background: var(--bg); font: 16px/1.5 sans-serif; }
</style>
</head>
<body>
<canvas id="bevy"></canvas>
<div id="fatal"></div>
<script type="module">
// SOUL DUEL's Bevy page (docs/bevy/BEVY_PORT.md §3 "Browser", from the M0a page). window.Module: _debug_cmd (queued until the
// wasm is up), _frames_done / _frames_submitted (the renderer's frame counters: render/mod.rs), _raf_frames (the browser frames the
// rAF loop below counted: the game runs one frame per browser frame, ruling R32, game.rs) and preinitializedWebGPUDevice
// (tools/run.mjs --fixed-dt starts its virtual clock once it exists, holds each frame until its queue's onSubmittedWorkDone
// resolves, and __settle awaits it). Bevy / wgpu make their own device, so that queue is the frame counters' (M3A_NOTES §9): it
// resolves once every frame Bevy submitted has finished on the GPU, and run.mjs waits on Bevy's real work. Failures print
// `engine fatal: ...` and show.
const early = [];
window.Module = { _debug_cmd(n) { early.push(n); }, _frames_done: () => 0, _frames_submitted: () => 0, _raf_frames: () => 0 };
const caughtUp = () => new Promise(res => {
  const poll = () => Module._frames_done() >= Module._frames_submitted() ? res() : setTimeout(poll, 1);   // (wall-time poll: rAF is run.mjs's clock)
  poll();
});
function fatal(msg) {
  console.log('engine fatal: ' + msg);
  const d = document.getElementById('fatal'); d.textContent = 'Cannot start: ' + msg; d.style.display = 'block';
}
import init, * as wasm from './index.js';
// Anything that breaks after the start shows too, not a black or frozen canvas: errors, rejected promises, and the log lines of a
// panic, a lost device (Bevy's `Caught DeviceLost error`), a wgpu validation or out-of-memory error (Bevy's `Caught rendering error`,
// then `Quitting the application due to ...` as it stops rendering: bevy_render error_handler.rs) and a pipeline the renderer could not
// build (`render: pipeline N failed`, render/mod.rs: READY then stays false).
const benign = m => String(m).includes('Using exceptions for control flow');
addEventListener('error', e => { if (!benign(e.message)) fatal(e.message); });
addEventListener('unhandledrejection', e => { if (!benign(e.reason)) fatal(String(e.reason)); });
for (const k of ['log', 'info', 'warn', 'error']) {
  const f = console[k].bind(console);
  console[k] = (...a) => { f(...a); const t = a.join(' '); if (/DeviceLost|panicked at|Caught rendering error|Quitting the application|render: pipeline/.test(t) && !t.startsWith('engine fatal')) fatal(t.replace(/%c/g, '').slice(0, 300)); };
}
(async () => {
  if (!navigator.gpu || location.search.includes('nogpu')) { fatal('WebGPU is not available in this browser'); return; }   // (?nogpu: the smoke of this path)
  let adapter = null;
  try { adapter = await navigator.gpu.requestAdapter(); } catch (e) {}
  if (!adapter) { fatal('no WebGPU adapter'); return; }
  let device;
  try { device = await adapter.requestDevice(); } catch (e) { fatal('no WebGPU device: ' + e); return; }
  Module.preinitializedWebGPUDevice = { device, queue: { onSubmittedWorkDone: caughtUp } };
  // index.gzip.wasm first (gzip bytes under a served name: the Artifact's binary files stop at 15 MB and .gz is not served), unzipped here; else index.wasm
  let src = 'index.wasm';
  try {
    const r = await fetch('index.gzip.wasm');
    if (r.ok) {
      const b = await r.arrayBuffer(), h = new Uint8Array(b, 0, 2);
      src = h[0] === 0x1f && h[1] === 0x8b   // still gzip (not already decoded by the server's content encoding)
        ? await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer() : b;
    }
  } catch (e) {}
  setTimeout(() => { const c = document.getElementById('bevy'); console.log(`page: canvas ${c.width}x${c.height} css ${c.clientWidth}x${c.clientHeight} dpr ${devicePixelRatio}`); }, 6000);
  try { await init({ module_or_path: src }); }
  catch (e) { if (!benign(e)) { fatal(String(e)); return; } }   // (winit's web loop start, not an error)
  Module._debug_cmd = n => wasm.debug_cmd(n);
  Module._frames_done = () => wasm.frames_done(); Module._frames_submitted = () => wasm.frames_submitted();
  Module._raf_frames = () => wasm.raf_frames();
  for (const n of early.splice(0)) wasm.debug_cmd(n);
  // one count per browser frame, from here on (not during the download and compile: under run.mjs --fixed-dt a rAF user moves the
  // virtual clock, so a loop started earlier would put a wall-time-long load into the page's time)
  const tick = () => { wasm.raf_tick(); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  // the renderer never ready (a pipeline that never compiles without an error, a stuck mesh upload): 30 s of the page shown, counted
  // from here (the download and the compile are behind us) and not while the tab is hidden; a slow phone's pipelines take seconds
  // (run.mjs's SwiftShader: the whole page is up, `startup:`, about 2.5 s after navigation)
  let shown = 0;
  const watch = setInterval(() => {
    if (wasm.ready()) clearInterval(watch);
    else if (!document.hidden && ++shown >= 30) { clearInterval(watch); fatal('the renderer did not start in 30 s'); }
  }, 1000);
})();
</script>
</body>
</html>
