# The Rust + Bevy port (docs/bevy/BEVY_PORT.md). Bevy is pinned for the whole port (=0.20.1).
[workspace]
resolver = "3"
members = ["spikes/m0a", "duel-sim", "duel-data", "duel-look", "duel-app", "duel-tools"]

[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "=0.2.16"

# opt-level 3, not "z" (M3a Task 11, docs/bevy/M3A_NOTES.md §11): the sim with both CPUs on runs 2.09-2.15x faster natively and
# 2.27-2.33x in wasm32, and the page's gzip wasm is 9.3 MB (6.3 at "z"), under the Artifact's 15 MB per binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

# Development wasm builds (rebuild speed over size / speed): no LTO, many codegen units, light optimisation; dependencies
# stay at opt-level 2 (profile.dev.package."*"). Release keeps the measured page's settings.
[profile.web-dev]
inherits = "dev"
opt-level = 1
debug = false
incremental = true
